<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            margin: 200px 200px;
            border-radius: 10%;
            background-color: rgb(255, 255, 255);
            border: 5px solid rgb(255, 0, 0);
            position: relative;
            animation: move 2s linear infinite;
        }
        .circle{
            width: 50px;
            height: 50px;
            margin: 100px 315px;
            background-color: blue;
            border-radius: 50%;
            position: absolute;
            top: 75px;
            left: 75px;
            animation: rotate 2s linear infinite;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="circle"><p style="color: rgb(0, 255, 94);">5</p></div>
</body>
</html>
